name: Zipi


on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  MacOs:
    runs-on: self-hosted
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v2
        with:
          path: zipi
          fetch-depth: 0 # Checkout history and tags
      - name: Setup path
        run: |
          echo "/Users/Shared/zipi/bigloo-install/bigloo/bin" >> $GITHUB_PATH
          echo "CC=/usr/local/bin/gcc-9" >> $GITHUB_ENV 
          echo "CPP=/usr/local/bin/gcc-9 -E" >> $GITHUB_ENV 
          echo "CXX=/usr/local/bin/gcc-9" >> $GITHUB_ENV 
      - name: Configure Zipi and install depedencies
        run: |
          cd zipi
          ./configure --bigloo=/Users/Shared/zipi/bigloo-install/bigloo/bin/bigloo
      - name: Compile Zipi
        run: |
          cd zipi
          make
      - name: Gambit tests
        run: |
          cd zipi
          make test-gambit
      - name: Bigloo tests
        run: |
          cd zipi
          make test-bigloo
