name: Zipi

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  MacOs:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v2
        with:
          path: zipi
          fetch-depth: 0 # Checkout history and tags
      - name: Compiling Zipi
        run: |
          cd zipi
          ./configure --bigloo=/usr/local/Cellar/bigloo/4.3e_1/lib/bigloo/4.3e/
          make
      - name: Zipi Tests
        run: |
          make test
