name: Zipi

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  MacOs:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0 # Checkout history and tags

      - name: Downloading Gambit
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: ci.yml
          repo: gambit/gambit
          path: gambit
          name: gambit-macos-x86_64

      - name: Installing Gambit
        run: |
          echo Unpacking gambit
          cd gambit
          tar zxvf gambit-macos-x86_64.tgz
          echo '::add-path bin'
          echo $PATH

      - name: Seting up path
        run: |
          echo step
          echo 2

