name: Zipi

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  MacOs:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v2
        with:
          path: zipi
          fetch-depth: 0 # Checkout history and tags
      - name: Setup path
        run: |
          echo "/Users/Shared/zipi/bigloo-install/bigloo/bin" >> $GITHUB_PATH
      - name: Configure Zipi and install depedencies
        run: |
          cd zipi
          ./configure --bigloo=/Users/Shared/zipi/bigloo-install/bigloo/bin/bigloo
      - name: Compile Zipi
        run: |
          make
      - name: Gambit tests
        run: |
          make test-gambit
      - name: Bigloo tests
        run: |
          make test-bigloo
