name: Zipi

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  MacOs:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v2
        with:
          path: zipi
          fetch-depth: 0 # Checkout history and tags
      - name: Downloading Gambit
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: ci.yml
          repo: gambit/gambit
          path: gambit
          name: gambit-macos-x86_64
      - name: Installing Gambit
        run: |
          echo Unpacking gambit
          cd gambit
          tar zxvf gambit-macos-x86_64.tgz
          echo "::add-path::$(pwd)/bin"
      - name: setup path
        run: |
          echo '::add-path::/usr/local/bin'
          echo $PATH
      - name: setting up CPython
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'
      - name: fixing python
        if: always()
        run:
          install_name_tool -change /Users/runner/hostedtoolcache/Python/3.8.5/x64/lib/libpython3.8.dylib /Users/Shared/zipi/actions-runner/_work/_tool/Python/3.8.5/x64/lib/libpython3.8.dylib /Users/Shared/zipi/actions-runner/_work/_tool/Python/3.8.5/x64/bin/./python
      - name: Compiling Zipi
        if: always()
        run: |
          echo compiling...
          ./configure --bigloolibdir=/usr/local/Cellar/bigloo/4.3e_1/lib/bigloo/4.3e/
          make
      - name: test
        run: |
          echo "print(42)" > test.py
          ./etc/py19 -t gambit test.py


