name: Zipi

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  MacOs:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v2
        with:
          path: zipi
          fetch-depth: 0 # Checkout history and tags
      - name: Downloading Gambit
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: ci.yml
          repo: gambit/gambit
          path: gambit
          name: gambit-macos-x86_64
      - name: Installing Gambit
        run: |
          echo Unpacking gambit
          cd gambit
          tar zxvf gambit-macos-x86_64.tgz
          echo "::add-path::$(pwd)/bin"
      - name: setup python
        run: |
          echo "::add-path::/Users/Shared/zipi/lib/python/bin"
      - name: setup env
        run: |
          echo "::set-env name=ZIPIROOT::$(pwd)"
          echo "::set-env name=GAMBOPT::~~zipicache=$ZIPIROOT/.zipicache,search=$ZIPIROOT/.."
      - run: python --version
      - name: Compiling Zipi
        run: |
          ./configure --bigloolibdir=/usr/local/Cellar/bigloo/4.3e_1/lib/bigloo/4.3e/
          make
      - name: Relinking
        run: ln -s ./etc/pysexp.py ./bin/pysexp.py
        if: always()
      - name: test
        run: ./etc/py19 -t gambit test.py
        if: always()
      - name: Running tests
        run : make test
        if: always()


