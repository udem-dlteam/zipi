name: Zipi


on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  MacOs:
    runs-on: self-hosted
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v2
        with:
          path: zipi
          fetch-depth: 0 # Checkout history and tags
      - name: Setup path and env variables
        run: |
          echo "/Users/Shared/zipi/bigloo-install/bigloo/bin" >> $GITHUB_PATH
          echo "CC=gcc-11" >> $GITHUB_ENV 
          echo "CPP=gcc-11 -E" >> $GITHUB_ENV 
          echo "CXX=gcc-11" >> $GITHUB_ENV 
      - name: Configure Zipi and install dependencies
        run: |
          cd zipi
          ./configure --bigloo=/Users/Shared/zipi/bigloo-install/bigloo/bin/bigloo --dependencies-dir=/Users/Shared/zipi/dependencies --prefix="$GITHUB_WORKSPACE/zipi-install" --zipicache=/Users/Shared/zipi/zipicache
      - name: Compile Zipi
        run: |
          cd zipi
          make
          make install
      - name: Gambit tests
        run: |
          cd zipi
          make test-gambit
        if: always()
      - name: Bigloo tests
        run: |
          cd zipi
          make test-bigloo
        if: always()
